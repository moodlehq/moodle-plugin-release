#
# Reusable workflow: submit a tagged Moodle plugin version to Moodle Marketplace
# at https://marketplace.moodle.com/
#
# Call this workflow from your plugin repository, see README.md for details.
#
# revision: 2026091001
#
name: Release Plugin version to Moodle Marketplace

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to be released (e.g. v1.4.0)'
        required: false
        type: string
      release-notes-source:
        description: 'Where to take the release notes from: ghrelease (the description of the GitHub Release belonging to the tag, default), input (the notes input of this workflow) or changelog (the changelog file in the root of the plugin)'
        required: false
        default: 'ghrelease'
        type: string
      notes:
        description: 'Release notes to be submitted, used when release-notes-source is set to input'
        required: false
        type: string
    secrets:
      MOODLE_MARKETPLACE_TOKEN:
        description: 'API token generated at https://marketplace.moodle.com/account/security'
        required: true

defaults:
  run:
    shell: bash

jobs:
  release-to-marketplace:
    runs-on: ubuntu-latest

    env:
      BASE_URL: 'https://marketplace.moodle.com/api'
      TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve Tag Name
        id: resolve-tag
        run: |
          TAGNAME="${{ inputs.tag }}"
          if [[ -z "${TAGNAME}" && $GITHUB_REF == refs/tags/* ]]; then
            TAGNAME="${GITHUB_REF##*/}"
          fi

          if [[ -z "${TAGNAME}" ]]; then
            echo "::error::No tag name provided!"
            exit 1
          fi

          echo "tag=${TAGNAME}" >> $GITHUB_OUTPUT

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}

      - name: Build Zip Package
        id: package
        run: |
          COMPONENT=$(php -r '$c = file_get_contents("version.php"); preg_match("/component\s*=\s*[\x27\"]([a-z0-9_]+)[\x27\"]/", $c, $m); echo $m[1] ?? "";')

          if [[ -z "$COMPONENT" ]]; then
            echo "::error::Could not read \$plugin->component from version.php"
            exit 1
          fi

          DIRNAME="${COMPONENT#*_}"
          ZIP_FILE="${DIRNAME}.zip"

          git archive --format=zip --prefix="${DIRNAME}/" -o "$ZIP_FILE" HEAD

          echo "component=${COMPONENT}" >> $GITHUB_OUTPUT
          echo "zip_file=${ZIP_FILE}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes
        id: release_notes
        env:
          TAGNAME: ${{ steps.resolve-tag.outputs.tag }}
          NOTES_SOURCE: ${{ inputs.release-notes-source }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          NOTES=""

          case "${NOTES_SOURCE}" in
            ghrelease|"")
              # An empty value is treated like the default, so that callers can pass the
              # source through from their own optional input without having to set it.

              # Take the release notes from the GitHub Release which belongs to the tag.
              NOTES=$(gh release view "$TAGNAME" --json body -q '.body' 2>/dev/null || true)
              ;;

            input)
              # Take the release notes from the notes input of this workflow.
              NOTES="${NOTES_INPUT}"
              ;;

            changelog)
              # Take the release notes from the first changelog file which exists in the plugin root.
              # The file name is matched case-insensitively.
              for CANDIDATE in CHANGES.md CHANGES.txt CHANGES CHANGELOG.md CHANGELOG.txt CHANGELOG; do
                CHANGELOG_FILE=$(find . -maxdepth 1 -type f -iname "${CANDIDATE}" -print -quit)

                if [[ -n "${CHANGELOG_FILE}" ]]; then
                  echo "Taking the release notes from ${CHANGELOG_FILE}"
                  NOTES=$(cat "${CHANGELOG_FILE}")
                  break
                fi
              done

              if [[ -z "${CHANGELOG_FILE}" ]]; then
                echo "::warning::No changelog file found in the plugin root, the version will be submitted without release notes"
              fi
              ;;

            *)
              echo "::error::Invalid release-notes-source '${NOTES_SOURCE}', expected one of: ghrelease, input, changelog"
              exit 1
              ;;
          esac

          if [[ -z "${NOTES}" ]]; then
            echo "::warning::No release notes could be determined from source '${NOTES_SOURCE}', the version will be submitted without release notes"
          fi

          # Use a delimiter which is random enough to never appear in the release notes
          # themselves, as these can be arbitrary multiline text.
          DELIMITER="notes-dab6827dc792e8e611ba73d744683587"

          echo "notes<<${DELIMITER}" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

      - name: Submit Version to Marketplace API
        env:
          TAGNAME: ${{ steps.resolve-tag.outputs.tag }}
          COMPONENT: ${{ steps.package.outputs.component }}
          ZIP_FILE: ${{ steps.package.outputs.zip_file }}
          NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          ENDPOINT="${BASE_URL}/plugins/${COMPONENT}/versions"

          echo "Submitting $ZIP_FILE for component $COMPONENT to $ENDPOINT..."

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "file=@${ZIP_FILE}" \
            -F "releaseNotes=${NOTES}" \
            -F "vcsTag=${TAGNAME}" \
            "${ENDPOINT}")

          echo "Response HTTP Status: ${HTTP_STATUS}"
          echo "Response Body:"
          jq . response.json 2>/dev/null || cat response.json

          if [[ "${HTTP_STATUS}" -ne 201 ]]; then
            echo "::error::API returned failure status: ${HTTP_STATUS}"

            if jq -e '.violations' response.json >/dev/null 2>&1; then
              echo "Validation Violations:"
              jq '.violations' response.json
            fi

            exit 1
          fi

          VERSION_ID=$(jq -r '.id' response.json)
          echo "Successfully created version ID: ${VERSION_ID}"
